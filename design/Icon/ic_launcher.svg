<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    Mosaic brand mark — translated from the MosaicWordmark composable.
    A rounded square rotated 45° (indigo diamond) with a centered white rounded square.
    Source: outer 28dp r9, inner 9dp r3; scaled ×2 here (56/18, r18/r6).
    Laid out on the 108 adaptive-icon canvas, centered at (54,54); the diamond tips
    fall inside the 66dp guaranteed-visible circle.
  -->
  <g transform="rotate(45 54 54)">
    <rect x="26" y="26" width="56" height="56" rx="18" ry="18" fill="#3F5BD8"/>
    <rect x="45" y="45" width="18" height="18" rx="6" ry="6" fill="#FFFFFF"/>
  </g>
</svg>
